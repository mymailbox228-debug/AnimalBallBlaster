
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    name: Export APK with Godot 4.3
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Prepare Android debug signing key
        run: |
          mkdir -p /root/.android build
          if [ ! -f /root/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore /root/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Import project and export APK
        run: |
          godot --headless --editor --path . --quit
          godot --headless --path . --export-debug "Android" build/AnimalBallBlaster.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AnimalBallBlaster-Android-APK
          path: build/AnimalBallBlaster.apk
          if-no-files-found: error
          retention-days: 14
